<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>VEXA — Voice Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#04080f;--s1:#080f1e;--s2:#0c1526;--s3:#111e35;
  --bd:rgba(46,134,255,0.12);--bdh:rgba(46,134,255,0.38);
  --t:#dde8fb;--t2:rgba(221,232,251,0.58);--t3:rgba(221,232,251,0.28);
  --blue:#2e86ff;--blt:#6aacff;--teal:#00d4c8;--gold:#f0b429;
  --rose:#ff5c7c;--em:#34d399;--violet:#a78bfa;
  --fh:'Manrope',sans-serif;--fm:'JetBrains Mono',monospace;
  --r:14px;--rs:9px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--t);font-family:var(--fh);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;padding:0 1rem 6rem;
}
.amb{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(90px);animation:drift 22s ease-in-out infinite alternate;}
.orb:nth-child(1){width:700px;height:700px;top:-260px;left:-160px;background:radial-gradient(circle,rgba(46,134,255,0.18) 0%,transparent 65%);animation-delay:0s;}
.orb:nth-child(2){width:500px;height:500px;top:-180px;right:-120px;background:radial-gradient(circle,rgba(0,212,200,0.10) 0%,transparent 65%);animation-delay:-10s;}
.orb:nth-child(3){width:380px;height:380px;bottom:8%;left:32%;background:radial-gradient(circle,rgba(167,139,250,0.08) 0%,transparent 65%);animation-delay:-18s;}
@keyframes drift{from{transform:translate(0,0)scale(1)}to{transform:translate(30px,20px)scale(1.07)}}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(rgba(46,134,255,0.045) 1px,transparent 1px);background-size:38px 38px;pointer-events:none;z-index:0;}
 
.wrap{position:relative;z-index:1;width:100%;max-width:780px;padding-top:2.8rem;}
 
header{text-align:center;margin-bottom:2.6rem;}
.logo-row{display:inline-flex;align-items:center;justify-content:center;gap:14px;margin-bottom:.45rem;}
.logo-box{
  width:54px;height:54px;border-radius:15px;flex-shrink:0;
  background:linear-gradient(145deg,#1a5fff 0%,#0abbba 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 32px rgba(46,134,255,0.45),0 0 64px rgba(0,212,200,0.14);
}
h1{
  font-size:clamp(2.3rem,5.2vw,3.1rem);font-weight:800;letter-spacing:.08em;
  background:linear-gradient(115deg,#fff 18%,var(--blt) 55%,var(--teal) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;
}
.tagline{font-family:var(--fm);font-size:.65rem;color:var(--t3);letter-spacing:.22em;text-transform:uppercase;margin-top:.4rem;}
 
.card{
  background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);
  padding:1.8rem 2rem 1.5rem;margin-bottom:1.2rem;
  box-shadow:0 2px 56px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.03);
}
 
/* ── animated bar waveform ── */
.wave-wrap{
  position:relative;height:80px;margin-bottom:1.6rem;
  border-radius:10px;overflow:hidden;
  background:linear-gradient(180deg,rgba(46,134,255,0.04) 0%,transparent 100%);
  display:flex;align-items:center;justify-content:center;
  gap:3px;padding:0 14px;
}
.wave-bar{
  width:4px;border-radius:3px;
  background:linear-gradient(180deg,rgba(46,134,255,0.35),rgba(46,134,255,0.12));
  height:6px;flex-shrink:0;
}
 
 
/* mic */
.mic-area{display:flex;flex-direction:column;align-items:center;gap:.7rem;margin-bottom:1.7rem;}
.mic-outer{position:relative;width:90px;height:90px;display:flex;align-items:center;justify-content:center;}
.mic-ring{
  position:absolute;inset:0;border-radius:50%;
  border:1.5px dashed rgba(46,134,255,.5);opacity:0;
  transition:opacity .3s;animation:spin 3s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.mic-ring.on{opacity:1;}
.mic-btn{
  width:72px;height:72px;border-radius:50%;border:none;
  background:linear-gradient(150deg,var(--blue) 0%,#1245cc 100%);
  cursor:pointer;position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;
  transition:transform .14s,box-shadow .2s;
  box-shadow:0 0 0 0 rgba(46,134,255,.4),0 6px 24px rgba(0,0,0,.55);
}
.mic-btn svg{width:30px;height:30px;color:#fff;}
.mic-btn:hover{transform:scale(1.07);box-shadow:0 0 28px rgba(46,134,255,.58),0 6px 24px rgba(0,0,0,.55);}
.mic-btn:active{transform:scale(.95);}
.mic-btn.rec{
  background:linear-gradient(150deg,var(--rose) 0%,#b91c1c 100%);
  animation:recpulse 1s ease-in-out infinite;
}
@keyframes recpulse{
  0%{box-shadow:0 0 0 0 rgba(255,92,124,.55),0 6px 24px rgba(0,0,0,.55);}
  50%{box-shadow:0 0 0 18px rgba(255,92,124,0),0 6px 24px rgba(0,0,0,.55);}
  100%{box-shadow:0 0 0 0 rgba(255,92,124,.55),0 6px 24px rgba(0,0,0,.55);}
}
.mic-lbl{font-family:var(--fm);font-size:.64rem;color:var(--t3);letter-spacing:.14em;text-transform:uppercase;}
 
.input-row{display:flex;gap:9px;}
.q-input{
  flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:var(--rs);
  padding:.82rem 1rem;color:var(--t);font-family:var(--fh);font-size:.92rem;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.q-input::placeholder{color:var(--t3);}
.q-input:focus{border-color:var(--bdh);box-shadow:0 0 0 3px rgba(46,134,255,.10);}
.ask-btn{
  background:linear-gradient(135deg,var(--blue) 0%,#1a5fff 100%);
  border:none;border-radius:var(--rs);padding:0 1.4rem;
  color:#fff;cursor:pointer;font-family:var(--fh);font-size:.85rem;font-weight:700;
  letter-spacing:.04em;white-space:nowrap;
  transition:opacity .15s,transform .1s,box-shadow .15s;
  box-shadow:0 2px 14px rgba(46,134,255,.38);
}
.ask-btn:hover{opacity:.87;box-shadow:0 2px 24px rgba(46,134,255,.55);}
.ask-btn:active{transform:scale(.97);}
.ask-btn:disabled{opacity:.25;cursor:not-allowed;box-shadow:none;}
 
.status{display:flex;align-items:center;gap:7px;margin-top:.8rem;min-height:20px;}
.s-dot{width:6px;height:6px;border-radius:50%;background:var(--t3);flex-shrink:0;transition:background .3s,box-shadow .3s;}
.s-dot.ok{background:var(--teal);box-shadow:0 0 7px var(--teal);}
.s-dot.load{background:var(--gold);box-shadow:0 0 7px var(--gold);animation:blink .8s ease-in-out infinite;}
.s-dot.err{background:var(--rose);box-shadow:0 0 8px rgba(255,92,124,.7);}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.18;}}
.s-txt{font-family:var(--fm);font-size:.66rem;color:var(--t3);}
.spin{width:13px;height:13px;border:2px solid var(--bd);border-top-color:var(--blue);border-radius:50%;animation:spin .5s linear infinite;display:none;flex-shrink:0;}
 
.errbox{background:rgba(255,92,124,.06);border:1px solid rgba(255,92,124,.22);border-radius:var(--rs);padding:.75rem 1rem;font-size:.82rem;color:var(--rose);display:none;margin-bottom:1rem;line-height:1.6;}
.errbox.on{display:block;}
 
.result{
  background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);
  padding:1.6rem;margin-bottom:1.2rem;display:none;
  box-shadow:0 4px 44px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.03);
  animation:rise .3s ease;
}
.result.on{display:block;}
@keyframes rise{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:translateY(0);}}
.r-title{font-size:1.1rem;font-weight:700;color:var(--t);margin-bottom:.55rem;line-height:1.3;}
.r-body{font-size:.90rem;line-height:1.80;color:var(--t2);}
 
.audio-row{display:none;align-items:center;gap:10px;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--bd);}
.play-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--s3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,box-shadow .15s;}
.play-btn svg{width:14px;height:14px;color:var(--t2);}
.play-btn:hover{background:var(--s2);box-shadow:0 0 12px rgba(46,134,255,.2);}
.play-btn.on{background:linear-gradient(135deg,var(--blue),var(--teal));}
.play-btn.on svg{color:#fff;}
.a-lbl{font-family:var(--fm);font-size:.62rem;color:var(--t3);letter-spacing:.10em;text-transform:uppercase;}
 
.sugg{display:none;margin-bottom:1.4rem;}
.sugg-lbl{font-family:var(--fm);font-size:.62rem;color:var(--t3);letter-spacing:.14em;text-transform:uppercase;margin-bottom:.5rem;}
.pills{display:flex;gap:7px;flex-wrap:wrap;}
.pill{
  background:var(--s2);border:1px solid var(--bd);border-radius:999px;
  padding:5px 14px;font-size:.75rem;color:var(--t2);
  cursor:pointer;font-family:var(--fh);
  transition:border-color .15s,color .15s,background .15s;white-space:nowrap;
}
.pill:hover{border-color:rgba(46,134,255,.4);color:var(--t);background:var(--s3);}
 
/* ── greeting overlay ── */
.greet-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(4,8,15,0.92);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .4s ease;pointer-events:none;
}
.greet-overlay.on{opacity:1;pointer-events:auto;}
.greet-box{
  background:linear-gradient(145deg,#0a1628,#111e35);
  border:1px solid rgba(46,134,255,0.35);border-radius:20px;
  padding:2.8rem 3rem;text-align:center;max-width:520px;width:90%;
  box-shadow:0 0 80px rgba(46,134,255,0.20),0 20px 60px rgba(0,0,0,0.6);
  animation:gb-in .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes gb-in{from{transform:scale(.88) translateY(20px);}to{transform:scale(1) translateY(0);}}
.greet-icon-wrap{
  width:72px;height:72px;border-radius:20px;margin:0 auto 1.4rem;
  background:linear-gradient(145deg,#1a5fff,#0abbba);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 32px rgba(46,134,255,0.45);
}
.greet-icon-wrap svg{width:38px;height:38px;color:#fff;}
.greet-time{font-family:var(--fm);font-size:.65rem;color:var(--teal);letter-spacing:.18em;text-transform:uppercase;margin-bottom:.6rem;}
.greet-msg{font-size:1.18rem;font-weight:600;color:var(--t);line-height:1.55;margin-bottom:1.6rem;}
 
.greet-wave{display:flex;align-items:center;justify-content:center;gap:3px;height:40px;margin-bottom:1.4rem;}
.gw-bar{width:4px;border-radius:3px;background:var(--teal);height:4px;opacity:.3;}
.greet-wave.active .gw-bar{opacity:1;}
 
.greet-skip{
  background:transparent;border:1px solid var(--bd);border-radius:999px;
  padding:7px 22px;color:var(--t3);font-family:var(--fm);font-size:.65rem;
  letter-spacing:.10em;cursor:pointer;transition:border-color .15s,color .15s;
}
.greet-skip:hover{border-color:var(--bdh);color:var(--t);}
</style>
</head>
<body>
 
<!-- greeting overlay -->
<div class="greet-overlay" id="greetOverlay">
  <div class="greet-box">
    <div class="greet-icon-wrap">
      <svg viewBox="0 0 40 40" fill="none">
        <rect x="5"  y="18" width="3" height="4"  rx="1.5" fill="rgba(255,255,255,0.38)"/>
        <rect x="10" y="14" width="3" height="12" rx="1.5" fill="rgba(255,255,255,0.60)"/>
        <rect x="15" y="9"  width="3" height="22" rx="1.5" fill="rgba(255,255,255,0.82)"/>
        <rect x="20" y="6"  width="3" height="28" rx="1.5" fill="#ffffff"/>
        <rect x="25" y="9"  width="3" height="22" rx="1.5" fill="rgba(255,255,255,0.82)"/>
        <rect x="30" y="14" width="3" height="12" rx="1.5" fill="rgba(255,255,255,0.60)"/>

<div class="amb"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
 
<div class="wrap">
  <header>
    <div class="logo-row">
      <div class="logo-box">
        <svg viewBox="0 0 40 40" fill="none" width="36" height="36">
          <circle cx="20" cy="20" r="17" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
          <rect x="5"  y="18" width="2.5" height="4"  rx="1.25" fill="rgba(255,255,255,0.38)"/>
          <rect x="9"  y="15" width="2.5" height="10" rx="1.25" fill="rgba(255,255,255,0.60)"/>
          <rect x="13" y="11" width="2.5" height="18" rx="1.25" fill="rgba(255,255,255,0.82)"/>
          <rect x="17" y="8"  width="2.5" height="24" rx="1.25" fill="#fff"/>
          <rect x="21" y="11" width="2.5" height="18" rx="1.25" fill="rgba(255,255,255,0.82)"/>
          <rect x="25" y="15" width="2.5" height="10" rx="1.25" fill="rgba(255,255,255,0.60)"/>
          <rect x="29" y="18" width="2.5" height="4"  rx="1.25" fill="rgba(255,255,255,0.38)"/>
        </svg>
      </div>
      <h1>VEXA</h1>
    </div>

  </header>
 
  <div class="card">
    <!-- waveform -->
    <div class="wave-wrap" id="waveWrap">
    </div>
 
    <!-- mic -->
    <div class="mic-area">
      <div class="mic-outer">
        <div class="mic-ring" id="micRing"></div>
        <button class="mic-btn" id="micBtn" aria-label="Speak">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8"  y1="23" x2="16" y2="23"/>
          </svg>
        </button>
      </div>
      <div class="mic-lbl" id="micLbl">CLICK TO SPEAK</div>
    </div>

      <input class="q-input" id="qInput" type="text" placeholder="Ask me anything…"/>
      <button class="ask-btn" id="askBtn">Ask →</button>

      <div class="s-dot" id="sDot"></div>

<script>
'use strict';
 
// ══════════════════════════════════════════════════════════════
//  WAVE BARS  — pure JS animation, no canvas
// ══════════════════════════════════════════════════════════════
const BAR_COUNT = 30;
const waveWrap  = document.getElementById('waveWrap');
const waveBars  = [];
 
for (let i = 0; i < BAR_COUNT; i++) {
  const b = document.createElement('div');
  b.className = 'wave-bar';
  waveWrap.appendChild(b);
  waveBars.push(b);
}
 
let waveMode = 'idle';
 
const WCOL = {
  idle:   ['rgba(46,134,255,0.4)',  'rgba(46,134,255,0.12)'],
  listen: ['rgba(52,211,153,1)',    'rgba(0,212,200,0.65)'],
  think:  ['rgba(240,180,41,1)',    'rgba(240,180,41,0.35)'],
  speak:  ['rgba(0,212,200,1)',     'rgba(46,134,255,0.7)'],
};
 
function animBars() {
  requestAnimationFrame(animBars);
  const t   = Date.now();
  const [c1,c2] = WCOL[waveMode] || WCOL.idle;
 
  waveBars.forEach((b, i) => {
    let h;
    const mid  = (BAR_COUNT - 1) / 2;
    const norm = i / (BAR_COUNT - 1); // 0..1
 
    switch (waveMode) {
      case 'idle':
        // soft breathing, very low amplitude
        h = (Math.sin(t / 1600 + i * 0.5) * 0.5 + 0.5) * 12 + 3;
        break;
      case 'listen':
        // rapid spiky noise
        h = Math.abs(Math.sin(t / 90 + i * 1.1)) * 58 * (0.5 + Math.random() * 0.5) + 4;
        break;
      case 'think':
        // smooth rolling wave
        h = (Math.sin(t / 180 - i * 0.42) * 0.5 + 0.5) * 52 + 5;
        break;
      case 'speak':
        // energetic dome — tallest in centre
        const dome = 1 - Math.pow(Math.abs(i - mid) / mid, 1.4);
        h = (Math.abs(Math.sin(t / 120 + i * 0.7)) * dome) * 62 + 4;
        break;
      default:
        h = 4;
    }
 
    b.style.height     = Math.max(3, h) + 'px';
    b.style.background = `linear-gradient(180deg,${c1},${c2})`;
  });
}
 
function setWaveMode(mode) {
  waveMode = mode;
}
 
animBars(); // start immediately
 
// ══════════════════════════════════════════════════════════════
//  STATUS
// ══════════════════════════════════════════════════════════════
const sDot    = document.getElementById('sDot');
const sTxt    = document.getElementById('sTxt');
const spinner = document.getElementById('spinner');
const errBox  = document.getElementById('errBox');
 
function setStatus(msg, state) {
  sTxt.textContent      = msg;
  sDot.className        = 's-dot ' + (state || '');
  spinner.style.display = state === 'load' ? 'inline-block' : 'none';
}
function clearErr() { errBox.className = 'errbox'; }
function showErr(msg) {
  errBox.textContent = msg;
  errBox.className   = 'errbox on';
  setStatus('Error', 'err');
  setWaveMode('idle');
}
 
// ══════════════════════════════════════════════════════════════
//  BROWSER TTS  — works always, no backend needed
// ══════════════════════════════════════════════════════════════
const synth = window.speechSynthesis;
 
function ensureVoices(cb) {
  if (!synth) { cb([]); return; }
  const vv = synth.getVoices();
  if (vv.length) { cb(vv); return; }
  synth.addEventListener('voiceschanged', () => cb(synth.getVoices()), { once: true });
  setTimeout(() => cb(synth ? synth.getVoices() : []), 800);
}
 
function speakBrowser(text, onEnd) {
  if (!synth) { if (onEnd) onEnd(); return; }
  synth.cancel();
  ensureVoices(voices => {
    const utt = new SpeechSynthesisUtterance(text);
    utt.rate = 0.95; utt.pitch = 1.0; utt.volume = 1.0;
    const en = voices.filter(v => v.lang.startsWith('en'));
    if (en.length) {
      utt.voice = en.find(v => /(natural|neural|enhanced|premium)/i.test(v.name))
               || en.find(v => /(google|microsoft)/i.test(v.name))
               || en[0];
    }
    utt.onstart = () => setWaveMode('speak');
    utt.onend   = () => { setWaveMode('idle'); setStatus('Ready','ok'); if (onEnd) onEnd(); };
    utt.onerror = () => { setWaveMode('idle'); setStatus('Ready','ok'); if (onEnd) onEnd(); };
    synth.speak(utt);
  });
}
 
// ══════════════════════════════════════════════════════════════
//  BASE64 AUDIO  (pyttsx3 backend WAV)
// ══════════════════════════════════════════════════════════════
let curAudio = null;
const audioRow = document.getElementById('audioRow');
const playBtn  = document.getElementById('playBtn');
const PLAY_PTS  = '5,3 19,12 5,21';
const PAUSE_SVG = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
 
function playB64Audio(b64, fallbackText) {
  if (curAudio) { curAudio.pause(); curAudio = null; }
  try {
    const bytes = atob(b64);
    const arr   = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
    curAudio = new Audio(URL.createObjectURL(new Blob([arr], { type:'audio/wav' })));
    curAudio.onplay  = () => { setWaveMode('speak'); playBtn.querySelector('svg').innerHTML = PAUSE_SVG; playBtn.classList.add('on'); };
    curAudio.onpause = () => { setWaveMode('idle');  playBtn.querySelector('svg').innerHTML = `<polygon points="${PLAY_PTS}"/>`; playBtn.classList.remove('on'); };
    curAudio.onended = () => { setWaveMode('idle');  playBtn.querySelector('svg').innerHTML = `<polygon points="${PLAY_PTS}"/>`; playBtn.classList.remove('on'); setStatus('Ready','ok'); };
    audioRow.style.display = 'flex';
    curAudio.play().catch(() => { audioRow.style.display = 'none'; speakBrowser(fallbackText); });
  } catch(_) { speakBrowser(fallbackText); }
}
 
playBtn.onclick = () => {
  if (!curAudio) return;
  curAudio.paused ? curAudio.play() : curAudio.pause();
};
 
// ══════════════════════════════════════════════════════════════
//  GREETING — show overlay AND speak the moment page opens
// ══════════════════════════════════════════════════════════════
const greetOverlay = document.getElementById('greetOverlay');
const greetMsg     = document.getElementById('greetMsg');
const greetTime    = document.getElementById('greetTime');
const greetSkip    = document.getElementById('greetSkip');
const greetWave    = document.getElementById('greetWave');
 
// Build greeting wave bars
const gwBars = [];
for (let i = 0; i < 22; i++) {
  const b = document.createElement('div');
  b.className = 'gw-bar';
  greetWave.appendChild(b);
  gwBars.push(b);
}
let gwTmr = null;
 
function animGreetWave(on) {
  greetWave.classList.toggle('active', on);
  clearInterval(gwTmr);
  if (on) {
    gwTmr = setInterval(() => {
      gwBars.forEach((b, i) => {
        const h = (Math.sin(Date.now() / 140 + i * 0.6) * 0.5 + 0.5) * 34 + 4;
        b.style.height = h + 'px';
      });
    }, 35);
  } else {
    gwBars.forEach(b => { b.style.height = '4px'; });
  }
}
 
function closeGreet() {
  if (synth) synth.cancel();
  clearInterval(gwTmr);
  animGreetWave(false);
  greetOverlay.classList.remove('on');
  setWaveMode('idle');
  setStatus('Ready', 'ok');
}
greetSkip.addEventListener('click', closeGreet);
 
function getTimeLabel() {
  const h = new Date().getHours();
  if (h >= 5  && h < 12) return 'MORNING';
  if (h >= 12 && h < 17) return 'AFTERNOON';
  if (h >= 17 && h < 21) return 'EVENING';
  return 'NIGHT';
}
 
function getLocalGreeting() {
  const h = new Date().getHours();
  if (h >= 5  && h < 12) return "Good morning! I am Vexa, your voice assistant. How can I help you today?";
  if (h >= 12 && h < 17) return "Good afternoon! I am Vexa, your voice assistant. What would you like to know?";
  if (h >= 17 && h < 21) return "Good evening! I am Vexa, your voice assistant. How can I assist you?";
  return "Good night! I am Vexa, your voice assistant. I am ready for your queries.";
}
 
// Show overlay + speak. audio_b64 optional (pyttsx3 from backend).
function doGreet(text, audio_b64) {
  greetMsg.textContent  = text;
  greetTime.textContent = 'GOOD ' + getTimeLabel();
  greetOverlay.classList.add('on');
  animGreetWave(true);
  setWaveMode('speak');
  setStatus('Speaking…', 'ok');
 
  const done = () => {
    animGreetWave(false);
    setWaveMode('idle');
    setTimeout(closeGreet, 700);
  };
 
  if (audio_b64) {
    // Try backend WAV first
    try {
      const bytes = atob(audio_b64);
      const arr   = new Uint8Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
      const ga = new Audio(URL.createObjectURL(new Blob([arr], { type:'audio/wav' })));
      ga.onended = done;
      ga.onerror = () => speakBrowser(text, done);
      ga.play().catch(() => speakBrowser(text, done));
      return;
    } catch (_) { /* fall through */ }
  }
 
  // Browser TTS — always works
  speakBrowser(text, done);
}
 
async function showGreeting() {
  try {
    const r = await fetch('/api/greeting');
    if (!r.ok) throw new Error('fail');
    const d = await r.json();
    doGreet(d.greeting || getLocalGreeting(), d.audio_b64 || null);
  } catch (_) {
    // Backend down — still greet via browser TTS, no silence
    doGreet(getLocalGreeting(), null);
  }
  setTimeout(closeGreet, 16000); // safety cap
}
 
// ══════════════════════════════════════════════════════════════
//  RESULT
// ══════════════════════════════════════════════════════════════
const resultCard = document.getElementById('resultCard');
const rTitle     = document.getElementById('rTitle');
const rBody      = document.getElementById('rBody');
 
function renderResult(data) {
  resultCard.className = 'result on';
  rTitle.textContent   = data.title || data.query || '';
  rBody.textContent    = data.answer || '';
  if (data.audio_b64) {
    playB64Audio(data.audio_b64, data.answer);
  } else {
    audioRow.style.display = 'none';
    speakBrowser(data.answer);
  }
}
 
// ══════════════════════════════════════════════════════════════
//  QUERY
// ══════════════════════════════════════════════════════════════
const qInput = document.getElementById('qInput');
const askBtn = document.getElementById('askBtn');
 
async function sendQuery(override) {
  const q = (override || qInput.value).trim();
  if (!q) return;
  qInput.value = q;
  if (synth) synth.cancel();
  clearErr();
  setStatus('Thinking…', 'load');
  setWaveMode('think');
  askBtn.disabled = true;
 
  try {
    const r = await fetch('/api/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q }),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw new Error(e.error || 'Server error ' + r.status);
    }
    const data = await r.json();
    renderResult(data);
    addSugg(q);
    setStatus('Ready', 'ok');
    setWaveMode('idle');
  } catch (e) {
    showErr('Could not get an answer: ' + e.message);
  } finally {
    askBtn.disabled = false;
  }
}
 
askBtn.onclick = () => sendQuery();
qInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendQuery(); });
 
// ══════════════════════════════════════════════════════════════
//  MICROPHONE
// ══════════════════════════════════════════════════════════════
const micBtn  = document.getElementById('micBtn');
const micLbl  = document.getElementById('micLbl');
const micRing = document.getElementById('micRing');
let recog = null, isRec = false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
 
if (SR) {
  recog = new SR();
  recog.lang = 'en-US'; recog.continuous = false; recog.interimResults = true;
  recog.onstart  = () => { isRec = true; micBtn.classList.add('rec'); micRing.classList.add('on'); micLbl.textContent = 'LISTENING — CLICK TO STOP'; setStatus('Listening…','ok'); setWaveMode('listen'); };
  recog.onresult = e => {
    let fin = '', interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) fin += t; else interim += t;
    }
    qInput.value = fin || interim;
    if (fin) setStatus('Heard: ' + fin, 'ok');
  };
  recog.onerror = e => {
    const m = {'no-speech':'No speech detected.','audio-capture':'Mic not accessible.','not-allowed':'Mic permission denied.','network':'Network error.'};
    showErr(m[e.error] || 'Voice error: ' + e.error);
    resetMic();
  };
  recog.onend = () => { const q = qInput.value.trim(); resetMic(); if (q) sendQuery(q); };
} else {
  micLbl.textContent   = 'VOICE NOT SUPPORTED';
  micBtn.style.opacity = '0.35';
}
 
function resetMic() {
  isRec = false; micBtn.classList.remove('rec'); micRing.classList.remove('on');
  micLbl.textContent = 'CLICK TO SPEAK'; setWaveMode('idle');
}
 
micBtn.addEventListener('click', () => {
  if (!SR) { showErr('Voice not supported. Use Chrome or Edge.'); return; }
  if (isRec) recog.stop();
  else { if (synth) synth.cancel(); qInput.value = ''; recog.start(); }
});
 
// ══════════════════════════════════════════════════════════════
//  SUGGESTIONS
// ══════════════════════════════════════════════════════════════
const suggArr  = [];
const suggWrap = document.getElementById('suggWrap');
const pillsEl  = document.getElementById('pills');
 
function addSugg(q) {
  if (suggArr.includes(q)) return;
  suggArr.unshift(q); if (suggArr.length > 7) suggArr.pop();
  pillsEl.innerHTML = '';
  suggArr.forEach(s => {
    const p = document.createElement('button');
    p.className = 'pill'; p.textContent = s;
    p.onclick = () => { qInput.value = s; sendQuery(); };
    pillsEl.appendChild(p);
  });
  suggWrap.style.display = 'block';
}
 
// ══════════════════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════════════════
const DEFAULTS = [
  'What is an Operating System?',
  'What are Data Structures?',
  'What is Object-Oriented Programming?',
  'What is a Stack?',
  'What is a Queue?',
  'What is a Binary Tree and BST?',
  'What is Big-O Notation?',
  'What is a Deadlock?',
  'What is Recursion?',
  'What is Machine Learning?',
  'What is Cloud Computing?',
  'What is SQL?',
];
 
window.addEventListener('DOMContentLoaded', () => {
  DEFAULTS.forEach(d => addSugg(d));
  setStatus('Ready', 'ok');
 
  // Browsers require a user gesture before playing audio.
  // We wait for the very first interaction (click/key/touch),
  // then immediately show and SPEAK the greeting.
  let greeted = false;
  function greetOnce() {
    if (greeted) return;
    greeted = true;
    showGreeting();
  }
 
  // Try auto-trigger after 600ms — works in most desktop browsers
  setTimeout(greetOnce, 600);
 
  // Fallback: any user gesture fires it
  ['click','keydown','touchstart'].forEach(ev =>
    document.addEventListener(ev, greetOnce, { once:true, passive:true })
  );
});
</script>
